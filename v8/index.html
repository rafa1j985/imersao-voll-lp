<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Imersão Presencial VOLL · V8</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,400;0,500;0,600;0,700;0,800;1,400&display=swap">
<style>

:root{
  --navy:#0B1622; --navy-2:#122033; --navy-3:#182A3D;
  --cream:#F7F4F0; --sand:#EAE6E1; --white:#FFFFFF;
  --ink:#0B1622; --ink-2:#3D4A5C; --muted:#8A94A3;
  --copper:#C59B76; --copper-2:#D4B08A; --copper-soft:rgba(197,155,118,.14);
  --line:rgba(11,22,34,.1); --line-dark:rgba(255,255,255,.08);
  --line-copper:rgba(197,155,118,.35);
  --paper:var(--cream); --bg:var(--navy); --surface:var(--white);
  --pine:var(--navy); --pine-2:var(--navy-2); --pine-text:rgba(247,244,240,.72);
  --gold:var(--copper); --gold-2:#D4B08A; --gold-soft:var(--copper-soft);
  --line-pine:var(--line-copper); --wa:#15803D;
  --serif:"Montserrat", system-ui, sans-serif;
  --sans:"Montserrat", system-ui, sans-serif;
  --display:"Montserrat", system-ui, sans-serif;
  --r:14px; --pill:999px; --wrap:1120px;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{scroll-behavior:smooth}
html,body{overflow-x:clip}
body{margin:0;background:var(--cream);color:var(--ink);font-family:var(--sans);font-size:16px;line-height:1.65;-webkit-font-smoothing:antialiased}
body.grain{position:relative}
body.grain::before{content:none}
h1,h2,h3,h4{margin:0;font-family:var(--display);font-weight:700;letter-spacing:-.03em;text-wrap:balance;line-height:1.08;color:var(--ink)}
p{margin:0}
a{color:inherit;text-decoration:none}
button{font:inherit;cursor:pointer;color:inherit;background:none;border:0}
button:disabled{opacity:.35;cursor:not-allowed;transform:none!important}
:focus-visible{outline:2px solid var(--copper);outline-offset:3px}
img{max-width:100%;display:block}
.wrap{max-width:var(--wrap);margin:0 auto;padding-inline:clamp(20px,5vw,40px)}
section{padding-block:clamp(64px,9vw,110px);position:relative}
.tone-light,.tone-paper{background:var(--cream);color:var(--ink)}
.tone-white{background:var(--white);color:var(--ink)}
.tone-dark,.tone-petrol{background:var(--navy);color:var(--cream)}
.tone-dark h1,.tone-dark h2,.tone-dark h3,.tone-petrol h1,.tone-petrol h2,.tone-petrol h3{color:var(--cream)}
.tone-dark .muted,.tone-petrol .muted,.tone-dark p,.tone-petrol .head p{color:var(--pine-text)}
.grid-bg{
  background-color:var(--navy);
  background-image:
    linear-gradient(rgba(255,255,255,.04) 1px, transparent 1px),
    linear-gradient(90deg, rgba(255,255,255,.04) 1px, transparent 1px);
  background-size:48px 48px;
}
.eyebrow{display:inline-block;font-size:11px;font-weight:600;letter-spacing:.18em;text-transform:uppercase;color:var(--copper)}
.eyebrow.pill-badge{
  display:inline-flex;align-items:center;gap:10px;
  border:1px solid var(--line-copper);border-radius:var(--pill);
  padding:8px 14px 8px 10px;color:var(--copper);background:rgba(197,155,118,.06);
}
.eyebrow.pill-badge::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--copper);flex:none}
.serif{font-family:var(--display);font-weight:700}
em.g{font-style:normal;color:var(--copper);font-weight:700}
b,strong{font-weight:700}
.head{max-width:720px;margin-bottom:44px}
.head .eyebrow{margin-bottom:16px}
.head h2{font-size:clamp(32px,4.8vw,56px);margin-bottom:14px}
.head p{font-size:16px;color:var(--ink-2);max-width:52ch;line-height:1.65}
.head.center{margin-inline:auto;text-align:center}
.head.center p{margin-inline:auto}
[data-reveal]{opacity:0;transform:translateY(18px);transition:opacity .65s cubic-bezier(.22,1,.36,1),transform .65s cubic-bezier(.22,1,.36,1)}
[data-reveal].is-in{opacity:1;transform:none}
@media (prefers-reduced-motion:reduce){
  *{animation:none!important;transition:none!important;scroll-behavior:auto!important}
  [data-reveal]{opacity:1;transform:none}
}

.photo{position:relative;border-radius:var(--r);overflow:hidden;background:var(--sand);border:1px solid var(--line)}
.photo.dark{background:var(--navy-2)}
.photo img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;filter:contrast(1.04) saturate(.92)}
.photo.has-img{background:var(--navy-2)}
.photo .cap,.cap{margin:12px;display:inline-flex;align-items:center;gap:6px;background:rgba(247,244,240,.94);color:var(--ink);font-size:11px;font-weight:500;letter-spacing:.04em;line-height:1.35;border-radius:var(--pill);padding:6px 12px;max-width:calc(100% - 24px);border:1px solid var(--line)}
.photo .cap:empty,.cap:empty{display:none}
.photo.has-img .cap{position:relative;z-index:1}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;border:0;border-radius:var(--pill);padding:15px 26px;font-weight:700;font-size:12.5px;text-decoration:none;letter-spacing:.06em;text-transform:uppercase;transition:background .2s,color .2s,border-color .2s,box-shadow .2s,transform .2s}
.btn .arr{display:inline-block;transition:transform .25s ease}
.btn:hover:not(:disabled) .arr{transform:translateX(4px)}
.btn-gold{background:var(--copper);color:var(--navy);box-shadow:0 0 32px rgba(197,155,118,.28)}
.btn-gold:hover:not(:disabled){background:var(--gold-2);color:var(--navy);box-shadow:0 8px 28px rgba(197,155,118,.35)}
.btn-outline{background:transparent;color:var(--ink);border:1px solid rgba(11,22,34,.22)}
.btn-outline:hover:not(:disabled){border-color:var(--copper);color:var(--copper)}
.btn-outline-light{background:transparent;color:var(--cream);border:1px solid rgba(247,244,240,.28)}
.btn-outline-light:hover{border-color:var(--copper);color:var(--copper)}
.tone-dark .btn-outline,.tone-petrol .btn-outline,.cta-band .btn-outline{color:var(--cream);border-color:rgba(247,244,240,.28)}
.tone-dark .btn-outline:hover,.cta-band .btn-outline:hover{border-color:var(--copper);color:var(--copper)}
.cta-row{display:flex;flex-wrap:wrap;align-items:center;gap:14px 18px}
.cta-row .note{font-size:13px;color:var(--ink-2);max-width:30ch;line-height:1.5}
.cta-duo{display:flex;flex-wrap:wrap;gap:10px;align-items:stretch}
.cta-duo .btn{flex-direction:column;gap:3px;padding:14px 20px;text-align:center;line-height:1.25;font-size:12px;white-space:normal;height:auto}
.cta-duo .btn small{font-size:11px;font-weight:500;opacity:.7;text-transform:none;letter-spacing:0}
.cta-duo.cta-stack,.cta-stack{flex-direction:column}
.cta-duo.cta-stack .btn{width:100%}
.frio-link{background:none;border:0;color:var(--ink-2);text-decoration:underline;text-underline-offset:3px;font-weight:500;padding:0;font:inherit;cursor:pointer}
.frio-link:hover{color:var(--copper)}
.cta-band{background:var(--navy);color:var(--cream);padding:64px 0;text-align:center}
.cta-band.grid-bg,.cta-band{background-color:var(--navy);background-image:linear-gradient(rgba(255,255,255,.035) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.035) 1px,transparent 1px);background-size:48px 48px}
.cta-band h2{font-family:var(--display);font-size:clamp(28px,4vw,48px);line-height:1.08;margin:0 auto 28px;max-width:16ch;font-weight:700;letter-spacing:-.03em;color:var(--cream)}
.cta-band .cta-duo{justify-content:center;max-width:400px;margin:0 auto}
.cta-band.hot{background:var(--cream);background-image:none;color:var(--ink);padding:80px 0 88px;border-block:1px solid var(--line)}
.cta-band.hot h2{font-size:clamp(34px,5vw,58px);max-width:14ch;margin-bottom:32px;color:var(--ink)}
.cta-band.hot .btn-outline{color:var(--ink);border-color:rgba(11,22,34,.22)}
.cta-band.hot .frio-link{color:var(--ink-2)}

.site-header{position:fixed;top:0;left:0;right:0;z-index:100;padding:14px 0;background:rgba(11,22,34,.92);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid var(--line-dark);transition:background .3s}
.site-header .wrap{display:flex;align-items:center;justify-content:space-between;gap:16px}
.site-header .brand{font-weight:700;letter-spacing:.08em;font-size:13px;text-transform:none;color:var(--cream)}
.site-header .brand span{display:block;font-weight:500;font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--copper);margin-left:0;margin-top:2px;opacity:1}
.site-header .hdr-cta{padding:10px 16px;font-size:11px}
.site-header.is-scrolled{background:rgba(11,22,34,.96)}
.site-header .pill{border:1px solid var(--line-dark);border-radius:var(--pill);padding:6px 12px;font-size:11px;color:rgba(247,244,240,.7);letter-spacing:.08em;background:rgba(255,255,255,.04)}
.topbar{background:var(--navy-2);color:var(--muted);font-size:13px;border-bottom:1px solid var(--line-dark)}
.topbar .wrap{display:flex;justify-content:space-between;gap:12px;padding-block:10px;flex-wrap:wrap}
.topbar b{color:var(--cream);font-weight:600}
.mbar{display:none;position:fixed;bottom:0;left:0;right:0;z-index:90;background:var(--navy);border-top:1px solid var(--line-dark);padding:12px 16px calc(12px + env(safe-area-inset-bottom));transition:transform .3s ease}
.mbar .btn{flex:1;width:100%;padding:14px}
.mbar.is-hidden{transform:translateY(110%);pointer-events:none}

/* Hero — dark grid + photo soft, SL style */
.hero-cine{position:relative;min-height:100vh;min-height:100dvh;display:flex;align-items:flex-end;overflow:hidden;color:var(--cream);padding:0;background:var(--navy)}
.hero-cine.grid-bg,.hero-cine{
  background-color:var(--navy);
  background-image:linear-gradient(rgba(255,255,255,.04) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.04) 1px,transparent 1px);
  background-size:48px 48px;
}
.hero-cine .hero-media{position:absolute;inset:0;z-index:0;opacity:.45}
.hero-cine .hero-media img,.hero-media .slide .photo img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;filter:contrast(1.05) saturate(.85) brightness(.55)}
.hero-media .slide{position:absolute;inset:0;opacity:0;transition:opacity 1.4s ease}
.hero-media .slide.is-on{opacity:1}
.hero-media .slide .photo{position:absolute;inset:0;border:0;border-radius:0;height:100%}
.hero-cine .hero-overlay{position:absolute;inset:0;z-index:1;background:linear-gradient(180deg,rgba(11,22,34,.55) 0%,rgba(11,22,34,.72) 45%,rgba(11,22,34,.94) 100%)}
.hero-cine .hero-content{position:relative;z-index:2;width:100%;max-width:var(--wrap);margin:0 auto;padding:0 clamp(20px,5vw,40px) clamp(48px,8vh,80px);padding-top:110px}
.hero-cine .hero-content h1{font-family:var(--display);font-size:clamp(40px,8.5vw,84px);font-weight:700;letter-spacing:-.035em;line-height:1.02;max-width:14ch;margin-bottom:18px;color:var(--cream)}
.hero-cine .hero-meta{display:inline-flex;align-items:center;gap:10px;font-size:10px;font-weight:600;letter-spacing:.16em;text-transform:uppercase;color:var(--copper);margin-bottom:22px;border:1px solid var(--line-copper);border-radius:var(--pill);padding:8px 14px 8px 10px;background:rgba(197,155,118,.06);max-width:100%}
.hero-cine .hero-meta::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--copper);flex:none}
.hero-cine .sub{font-size:16px;color:rgba(247,244,240,.78);max-width:38ch;margin:0 0 28px;line-height:1.65}
.hero-cine .scroll-hint{position:absolute;bottom:28px;right:clamp(20px,5vw,40px);z-index:2;font-size:10px;letter-spacing:.22em;text-transform:uppercase;color:rgba(247,244,240,.4);writing-mode:vertical-rl;transform:rotate(180deg)}
.hero-cine .scroll-hint::before{content:"";display:block;width:1px;height:48px;background:rgba(197,155,118,.45);margin:0 auto 12px}

.fs-photo{position:relative;min-height:70vh;overflow:hidden;padding:0;display:flex;align-items:flex-end}
.fs-photo.full{min-height:100vh;min-height:100dvh}
.fs-photo img,.fs-photo>.photo{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;border:0;border-radius:0}
.fs-photo>.photo img{filter:contrast(1.05) saturate(.9)}
.fs-photo .fs-cap{position:relative;z-index:2;padding:clamp(28px,5vw,48px) clamp(20px,5vw,40px);font-family:var(--display);font-size:clamp(28px,5vw,56px);font-weight:700;letter-spacing:-.03em;line-height:1.05;color:var(--cream);max-width:18ch}
.fs-photo.dark-overlay::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,transparent 30%,rgba(11,22,34,.9) 100%);z-index:1}
.fs-photo.light-overlay::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,transparent 35%,rgba(247,244,240,.96) 100%);z-index:1}
.fs-photo.light-overlay .fs-cap{color:var(--ink)}

.statement{padding-block:clamp(72px,11vw,120px);background:var(--cream)}
.statement .mega{font-family:var(--display);font-size:clamp(36px,7vw,80px);font-weight:700;letter-spacing:-.035em;line-height:1.02;max-width:16ch;color:var(--ink)}
.statement.light{background:var(--cream);color:var(--ink)}
.statement.dark{background:var(--navy);color:var(--cream);background-image:linear-gradient(rgba(255,255,255,.035) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.035) 1px,transparent 1px);background-size:48px 48px}
.statement.dark .mega{color:var(--cream)}

.stats{background:var(--navy);color:var(--cream);border-block:1px solid var(--line-dark);padding-block:0;background-image:linear-gradient(rgba(255,255,255,.035) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.035) 1px,transparent 1px);background-size:48px 48px}
.stats .wrap{display:grid;grid-template-columns:repeat(4,1fr)}
.stats div.s{padding:36px 22px;border-left:1px solid var(--line-dark)}
.stats div.s:first-child{border-left:0;padding-left:0}
.stats strong{display:block;font-family:var(--display);font-size:clamp(36px,4.5vw,56px);line-height:1;color:var(--cream);font-weight:700;letter-spacing:-.03em;font-variant-numeric:tabular-nums}
.stats span{font-size:13px;color:rgba(247,244,240,.65);display:block;margin-top:10px;max-width:16ch}
.stats div.s.is-in strong{color:var(--copper)}
@keyframes statPop{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.stats div.s.is-in strong{animation:statPop .55s ease both}

.when{background:var(--cream);color:var(--ink);padding:24px 0;border-bottom:1px solid var(--line)}
.when .wrap{display:flex;flex-wrap:wrap;gap:8px 36px;align-items:baseline}
.when .when-date{font-family:var(--display);font-size:clamp(20px,2.6vw,30px);font-weight:700;letter-spacing:-.02em;color:var(--ink)}
.when .when-date b,.when .when-date strong{color:var(--copper);font-weight:700}
.when .when-place{font-size:14px;color:var(--ink-2)}
.when .when-place b{color:var(--ink);font-weight:600}

.vs{display:grid;grid-template-columns:1fr 1.1fr;gap:0;border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.vs > div{padding:clamp(28px,4vw,48px)}
.vs .a{background:var(--sand)}
.vs .b{background:var(--navy);color:var(--cream)}
.vs .b h3{color:var(--cream)}
.vs h3,.fit h3{font-size:clamp(24px,3vw,36px);margin-bottom:24px}
.vs ul,.fit ul{list-style:none;margin:0;padding:0;display:grid;gap:14px}
.vs li,.fit li{display:flex;gap:12px;align-items:flex-start;font-size:15px;color:var(--ink-2)}
.vs li::before,.fit li::before{content:"";flex:none;width:6px;height:6px;margin-top:8px;border-radius:50%;background:currentColor;opacity:.35}
.vs .b li{color:rgba(247,244,240,.8)}
.vs .b li::before,.fit .y li::before{background:var(--copper);opacity:1}
.quote,.quote-mega{font-family:var(--display);font-size:clamp(30px,4.8vw,52px);font-weight:700;letter-spacing:-.03em;line-height:1.08;max-width:14ch;margin-top:48px;color:var(--ink)}
.tone-light .quote,.tone-light #difQuote{color:var(--ink)}

.resolve,.resolve-ed{background:var(--cream);color:var(--ink)}
.resolve .head,.resolve-ed .head{max-width:780px;margin-bottom:56px}
.resolve .head h2,.resolve-ed .head h2{font-size:clamp(34px,4.8vw,58px)}
.resolve-block{display:grid;grid-template-columns:.9fr 1.1fr;gap:clamp(28px,5vw,56px);align-items:center;margin-bottom:64px}
.resolve-block.flip{grid-template-columns:1.1fr .9fr}
.resolve-block.flip .resolve-copy{order:-1}
.resolve-block.no-photo{grid-template-columns:1fr;max-width:680px}
.resolve .photo,.resolve-ed .photo{aspect-ratio:4/5;border-radius:var(--r)}
.resolve-n{display:block;font-family:var(--display);font-size:clamp(48px,8vw,88px);font-weight:700;letter-spacing:-.04em;line-height:.85;color:var(--copper);margin-bottom:12px}
.resolve h3,.resolve-ed h3{font-size:clamp(26px,3.5vw,42px);margin-bottom:14px}
.resolve .lead{font-size:15.5px;color:var(--ink-2);margin-bottom:20px;max-width:42ch}
.resolve .pill{display:inline-flex;background:var(--copper-soft);color:var(--copper);border:1px solid var(--line-copper);border-radius:var(--pill);padding:6px 14px;font-size:11px;font-weight:600;margin-bottom:14px;letter-spacing:.12em;text-transform:uppercase}
.checks{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.checks li{display:flex;gap:12px;align-items:flex-start;background:var(--white);border-radius:var(--r);padding:12px 14px;font-weight:500;border:1px solid var(--line);font-size:14.5px}
.checks li::before{content:"";flex:none;width:6px;height:6px;margin-top:8px;border-radius:50%;background:var(--copper)}
.proof{margin-top:18px;padding-left:14px;border-left:2px solid var(--copper);color:var(--ink-2);font-size:14.5px}
.lead-photo.photo{aspect-ratio:16/9;margin:0 auto 40px;max-width:960px}
.resolve-more{background:var(--sand);color:var(--ink);padding:80px 0 88px}
.resolve-more .resolve-sub{font-family:var(--display);font-size:clamp(30px,4.8vw,52px);line-height:1.08;margin:0 auto 40px;text-align:center;max-width:16ch;font-weight:700}
.resolve-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.resolve-card{background:var(--white);border:1px solid var(--line);border-radius:var(--r);padding:22px;display:grid;grid-template-columns:auto 1fr;gap:14px}
.resolve-card .rn{font-family:var(--display);font-size:28px;line-height:1;color:var(--copper);font-weight:700}
.resolve-card .n{display:block;font-size:11px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin-bottom:6px}
.resolve-card p{font-size:14px;color:var(--ink-2);line-height:1.5;margin:0}

.exec,.exec-ed{background:var(--navy);color:var(--cream);background-image:linear-gradient(rgba(255,255,255,.035) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.035) 1px,transparent 1px);background-size:48px 48px}
.exec .head h2,.exec-ed .head h2{color:var(--cream)}
.exec .head p,.exec-ed .head p{color:var(--pine-text)}
.exec .eyebrow,.exec-ed .eyebrow{color:var(--copper)}
.exec-grid,.exec-rail{display:grid;grid-template-columns:repeat(5,1fr);gap:12px}
.exec-card{padding:22px 18px;border:1px solid var(--line-dark);border-radius:var(--r);background:rgba(255,255,255,.03);display:grid;gap:8px;align-content:start}
.exec-card .ico{width:36px;height:36px;border-radius:10px;display:grid;place-items:center;background:var(--copper-soft);color:var(--copper);border:1px solid var(--line-copper)}
.exec-card .ico svg{width:14px;height:14px}
.exec-card .n{font-size:10px;font-weight:600;letter-spacing:.16em;text-transform:uppercase;color:var(--copper)}
.exec-card strong{font-family:var(--display);font-size:20px;font-weight:700;line-height:1.15;color:var(--cream)}
.exec-card p{font-size:13.5px;color:rgba(247,244,240,.65);line-height:1.5}
.exec-photos{display:grid;grid-template-columns:1.4fr 1fr;gap:12px;margin-top:36px}
.exec-photos .photo{height:280px}
.exec-note{margin-top:24px;color:rgba(247,244,240,.65);font-size:14.5px;max-width:68ch}

.partners-ed{padding:0;background:var(--cream)}
.partner-ed{min-height:85vh;display:grid;grid-template-columns:1fr 1fr;overflow:hidden;border-bottom:1px solid var(--line)}
.partner-ed:nth-child(even){direction:rtl}
.partner-ed:nth-child(even)>*{direction:ltr}
.partner-ed .photo{min-height:85vh;border:0;border-radius:0;height:100%}
.partner-ed .photo img{filter:contrast(1.04) saturate(.9)}
.partner-ed .copy{display:flex;flex-direction:column;justify-content:flex-end;padding:clamp(32px,6vw,72px);background:var(--cream)}
.partner-ed h3{font-size:clamp(44px,7.5vw,84px);font-weight:700;letter-spacing:-.04em;line-height:.92;margin-left:-.06em}
.partner-ed .role{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--copper);margin:16px 0 12px;font-weight:600}
.partner-ed p{color:var(--ink-2);font-size:15px;max-width:36ch}
.partners{display:grid;grid-template-columns:repeat(3,1fr);gap:20px}
.partner .photo{aspect-ratio:4/5;margin-bottom:16px}
.partner h3{font-size:clamp(24px,2.5vw,32px);font-weight:700}
.partner .role{font-size:11px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--copper);margin:8px 0}
.partner p{color:var(--ink-2);font-size:14.5px}

.experts-ed{padding:0;background:var(--white)}
.expert-ed{position:relative;min-height:80vh;display:grid;grid-template-columns:1.1fr .9fr;overflow:hidden;border-bottom:1px solid var(--line)}
.expert-ed:nth-child(even){grid-template-columns:.9fr 1.1fr}
.expert-ed:nth-child(even) .photo{order:2}
.expert-ed .photo{min-height:80vh;border:0;border-radius:0;height:100%}
.expert-ed .copy{display:flex;flex-direction:column;justify-content:center;padding:clamp(32px,5vw,64px);background:var(--cream)}
.expert-ed h3{font-size:clamp(36px,6vw,72px);font-weight:700;letter-spacing:-.04em;line-height:.92;max-width:8ch}
.expert-ed .role{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--copper);margin-top:18px;font-weight:600}
.expert-ed .spec{font-size:14.5px;color:var(--ink-2);margin-top:10px;max-width:32ch}
.experts-wrap{background:var(--cream)}
.experts,.experts.compact{display:grid;grid-template-columns:repeat(3,1fr);gap:28px 20px}
.expert{display:grid;gap:14px}
.expert .photo{width:100%;aspect-ratio:3/2}
.expert .photo .cap{display:none!important}
.expert h3{font-size:clamp(22px,2.2vw,28px);font-weight:700}
.expert .role{font-size:11px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--copper)}
.expert .spec{font-size:14px;color:var(--ink-2)}

.alums-ed{background:var(--cream);padding-block:clamp(64px,9vw,100px)}
.alum-ed{display:grid;grid-template-columns:140px 1fr auto;gap:24px;align-items:center;padding:24px;margin-bottom:12px;background:var(--white);border:1px solid var(--line);border-radius:var(--r)}
.alum-ed .photo{aspect-ratio:1;width:140px;height:140px}
.alum-ed h3{font-size:clamp(22px,2.5vw,30px);font-weight:700}
.alum-ed .where,.alum-ed .mt{font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--copper);margin-top:6px;font-weight:600}
.alum-ed blockquote{font-size:15px;color:var(--ink-2);max-width:48ch;margin:8px 0 0}
.alum-ed .body{min-width:0}
.alums{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.alum{background:var(--white);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;display:flex;flex-direction:column}
.alum .photo{aspect-ratio:4/3;border-radius:0;border:0;border-bottom:1px solid var(--line)}
.alum .body{padding:22px;display:flex;flex-direction:column;gap:8px;flex:1}
.alum .mt{color:var(--copper);font-size:10px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;border-bottom:1px solid var(--line-copper);align-self:flex-start}
.alum h3{font-size:22px;font-weight:700}
.alum .where{font-size:13px;color:var(--muted)}
.alum blockquote{margin:4px 0 8px;font-size:14.5px;color:var(--ink-2);flex:1}
.wa{display:flex;align-items:center;justify-content:center;gap:8px;background:var(--wa);color:#fff;text-decoration:none;border-radius:var(--pill);padding:12px 16px;font-weight:700;font-size:12px;text-transform:uppercase;letter-spacing:.04em}
.wa:hover{opacity:.92}
.wa svg{width:16px;height:16px}
.more{display:block;margin:28px auto 0;background:none;border:1px solid rgba(11,22,34,.22);border-radius:var(--pill);padding:11px 18px;font-weight:700;color:var(--ink);letter-spacing:.04em;text-transform:uppercase;font-size:12px}
.more:hover{border-color:var(--copper);color:var(--copper)}

.days-sticky{position:relative;background:var(--cream);padding:0}
.days-sticky .days-rail{position:sticky;top:0;z-index:5;display:flex;gap:0;background:rgba(247,244,240,.94);backdrop-filter:blur(8px);border-bottom:1px solid var(--line);padding:14px clamp(20px,5vw,40px);font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);font-weight:600}
.days-sticky .days-rail span{padding:6px 14px;border-right:1px solid var(--line)}
.days-sticky .days-rail span.on{color:var(--copper)}
.day-panel{position:sticky;top:48px;min-height:100vh;min-height:100dvh;display:grid;grid-template-columns:1fr 1fr;overflow:hidden;border-bottom:1px solid var(--line);background:var(--white)}
.day-panel .day-photo{position:relative;min-height:100%;overflow:hidden}
.day-panel .day-photo .photo{position:absolute;inset:0;width:100%;height:100%;border:0;border-radius:0}
.day-panel .day-copy{position:relative;display:flex;flex-direction:column;justify-content:center;padding:clamp(32px,6vw,72px);background:var(--cream)}
.day-panel .day-num{position:absolute;left:-.08em;bottom:-.18em;font-family:var(--display);font-size:clamp(120px,38vw,380px);font-weight:800;letter-spacing:-.06em;line-height:.75;color:rgba(11,22,34,.05);pointer-events:none;z-index:0}
.day-panel .day-copy h3{font-size:clamp(28px,4vw,48px);margin-bottom:16px;position:relative;z-index:1}
.day-panel .day-copy p{color:var(--ink-2);font-size:15.5px;max-width:40ch;position:relative;z-index:1}
.days{display:grid;gap:0;max-width:760px;border-top:1px solid var(--line)}
.day{display:grid;grid-template-columns:56px 1fr;gap:6px 20px;padding:24px 0;border-bottom:1px solid var(--line)}
.day .num{grid-row:1/3;font-family:var(--display);font-size:clamp(28px,3.5vw,38px);color:var(--copper);font-weight:700}
.day .when{font-size:11px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin:0;background:transparent;border:0;padding:0}
.day h3{font-size:clamp(20px,2.2vw,28px);font-weight:700;margin:0}
.day p{font-size:14.5px;color:var(--ink-2);margin:4px 0 0;grid-column:2}

.fit{display:grid;grid-template-columns:1fr 1fr;gap:0;border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.fit > div{padding:36px}
.fit .y{background:var(--navy);color:var(--cream)}
.fit .y h3{color:var(--cream)}
.fit .n{background:var(--white);border-left:1px solid var(--line)}
.fit .n li{color:var(--ink-2)}
.incl,.paths{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:24px}
.card,.path-card{background:var(--white);border:1px solid var(--line);border-radius:var(--r);padding:28px}
.card h3,.path-card h3{font-size:clamp(22px,2.8vw,30px);margin-bottom:18px;font-weight:700}
.path-card .path-label{display:block;font-size:11px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--copper);margin-bottom:10px}
.path-card .btn-outline{color:var(--ink);border-color:rgba(11,22,34,.22);width:100%}
.ilist{list-style:none;margin:0;padding:0}
.ilist li{display:flex;justify-content:space-between;gap:14px;padding:14px 0;border-top:1px solid var(--line);font-size:14.5px}
.ilist li span{flex:none;font-size:10px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--copper);align-self:center;border-bottom:1px solid var(--line-copper)}
.ilist li span.opt{color:var(--muted);border-color:var(--line)}
.steps{display:grid;gap:18px}
.st{display:grid;grid-template-columns:36px 1fr;gap:12px}
.st i{font-style:normal;width:36px;height:36px;border-radius:var(--pill);background:var(--copper);color:var(--navy);display:grid;place-items:center;font-family:var(--display);font-size:16px;font-weight:700}
.st strong{display:block;font-size:15.5px;font-weight:700}
.st p{font-size:14px;color:var(--ink-2)}
.pnote{margin-top:20px;padding-top:16px;border-top:1px solid var(--line);font-size:14px;color:var(--ink-2)}

.faq-ed,.faq{background:var(--cream);color:var(--ink)}
.faq details{border-bottom:1px solid var(--line);padding:20px 0;background:transparent}
.faq summary{font-family:var(--display);font-size:clamp(18px,2.2vw,24px);font-weight:700;cursor:pointer;list-style:none;display:flex;justify-content:space-between;gap:16px}
.faq summary::-webkit-details-marker{display:none}
.faq summary::after{content:"+";color:var(--copper);font-size:22px}
.faq details[open] summary::after{content:"–"}
.faq details p{margin-top:12px;color:var(--ink-2);font-size:15px;max-width:62ch}

.final,.final-ed{position:relative;min-height:70vh;display:flex;align-items:flex-end;overflow:hidden;padding:0;background:var(--navy);color:var(--cream);background-image:linear-gradient(rgba(255,255,255,.035) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.035) 1px,transparent 1px);background-size:48px 48px}
.final::after,.final-ed::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(11,22,34,.35),rgba(11,22,34,.92));z-index:1}
.final .wrap,.final-ed .wrap{position:relative;z-index:2;padding-block:clamp(64px,10vw,120px)}
.final h2,.final-ed h2{font-size:clamp(36px,6.5vw,72px);font-weight:700;letter-spacing:-.035em;max-width:14ch;margin-bottom:28px;color:var(--cream)}
.final p,.final-ed p{color:var(--pine-text)}
.final .eyebrow{color:var(--copper)}
footer{background:var(--navy);color:var(--muted);font-size:12.5px;border-top:1px solid var(--line-dark);padding:28px 0}
footer .wrap{display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap}

/* QUIZ — dark navy + cream cards */
#quiz{min-height:100vh;background:var(--cream);color:var(--ink);display:grid;grid-template-columns:minmax(280px,.95fr) 1.05fr}
.q-side{position:relative;padding:44px;display:flex;flex-direction:column;justify-content:space-between;border-right:1px solid var(--line-dark);background:var(--navy);background-image:linear-gradient(rgba(255,255,255,.035) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.035) 1px,transparent 1px);background-size:48px 48px}
.q-side > .photo{position:absolute;inset:0;border-radius:0;border:0;opacity:.35}
.q-side > .photo::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(11,22,34,.4),rgba(11,22,34,.9));z-index:1}
.q-side > .photo .cap{position:absolute;top:12px;right:12px;z-index:2}
.q-side-top,.q-side-bottom{position:relative;z-index:2;color:var(--cream)}
.brand{font-weight:700;letter-spacing:.06em;font-size:13px;text-transform:none;color:inherit}
.brand span{display:block;font-weight:500;opacity:1;letter-spacing:.14em;margin-left:0;margin-top:2px;font-size:10px;text-transform:uppercase;color:var(--copper)}
.q-side-bottom{max-width:420px}
.q-side-bottom p.serif{font-family:var(--display);font-size:clamp(26px,3vw,36px);line-height:1.15;color:var(--cream);font-weight:700}
.q-side-bottom small{display:block;margin-top:16px;color:rgba(247,244,240,.65);font-size:13px}
.q-main{display:flex;flex-direction:column;justify-content:center;padding:48px clamp(20px,5vw,56px);background:var(--cream)}
.q-card{width:100%;max-width:520px;margin-inline:auto}
.q-mobile-quote{display:none;width:100%;max-width:520px;margin:0 auto 28px}
.q-mobile-quote .photo{height:140px;margin-bottom:16px}
.q-mobile-quote .brand{margin-bottom:12px;color:var(--ink)}
.q-mobile-quote .brand span{color:var(--copper)}
.q-mobile-quote p.serif{font-family:var(--display);font-size:clamp(24px,5.2vw,32px);line-height:1.15;font-weight:700;color:var(--ink)}
.q-mobile-quote small{display:block;margin-top:10px;color:var(--muted);font-size:13px}
.q-progress{height:3px;background:var(--line);margin-bottom:32px;overflow:hidden;border-radius:var(--pill)}
.q-progress i{display:block;height:100%;background:var(--copper);transition:width .4s ease;border-radius:var(--pill)}
.q-step{font-size:11px;color:var(--muted);font-weight:600;letter-spacing:.18em;text-transform:uppercase;margin-bottom:14px}
.q-card h1,.q-card h2{font-family:var(--display);font-size:clamp(30px,4vw,44px);line-height:1.08;margin-bottom:12px;font-weight:700;color:var(--ink)}
.q-help{color:var(--ink-2);margin-bottom:24px}
.q-count{font-size:13px;font-weight:600;color:var(--copper);margin:-10px 0 16px}
.q-opts{display:grid;gap:8px}
.q-opt{display:flex;gap:12px;align-items:center;text-align:left;width:100%;background:var(--white);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;transition:border-color .18s,background .18s,box-shadow .18s}
.q-opt:hover{border-color:rgba(197,155,118,.5)}
.q-opt.sel{border-color:var(--copper);background:var(--copper-soft);box-shadow:0 0 0 1px var(--copper)}
.q-opt .dot{width:16px;height:16px;border-radius:50%;border:1.5px solid var(--muted);flex:none;display:grid;place-items:center;font-size:10px;font-weight:700;color:var(--navy)}
.q-opt.sel .dot{border-color:var(--copper);background:var(--copper)}
.q-opt:not(.chk):not(.rank).sel .dot::after{content:"";width:5px;height:5px;border-radius:50%;background:var(--navy)}
.q-opt.chk .dot{border-radius:5px}
.q-opt.chk.sel .dot::after{content:"";width:8px;height:5px;border-left:1.5px solid var(--navy);border-bottom:1.5px solid var(--navy);transform:rotate(-45deg) translate(1px,-1px);background:none}
.q-opt.rank .dot{font-size:10px}
.q-opt.rank.sel .dot::after{content:none}
.q-opt.rank.sel .dot{color:var(--navy)}
.q-opt strong{display:block;font-weight:700;font-size:14.5px;color:var(--ink)}
.q-opt small{display:block;color:var(--ink-2);font-size:13px;line-height:1.45;margin-top:2px}
.q-nav{display:flex;justify-content:space-between;align-items:center;margin-top:24px;gap:12px}
.q-back{background:none;border:0;color:var(--muted);padding:8px 0;font-weight:500}
.q-back:hover{color:var(--copper)}
.q-list{list-style:none;padding:0;margin:0 0 28px;display:grid;gap:12px;color:var(--ink-2)}
.q-list li{display:flex;gap:12px;align-items:center}
.q-list li::before{content:"";width:6px;height:6px;flex:none;border-radius:50%;background:var(--copper)}
.q-form{display:grid;gap:12px}
.q-form label{display:grid;gap:6px;font-size:12px;font-weight:600;color:var(--muted);letter-spacing:.06em;text-transform:uppercase}
.q-form input{font:inherit;font-size:16px;background:var(--white);border:1px solid var(--line);color:var(--ink);border-radius:var(--r);padding:13px 14px}
.q-form input:focus{border-color:var(--copper);outline:none;box-shadow:0 0 0 3px var(--copper-soft)}
.q-err{color:#B91C1C;font-size:13.5px;min-height:18px}

#escolha,#aplicacao,#agenda,#turma1{min-height:100vh;background:var(--cream);color:var(--ink)}
#escolhaInner,#aplicacaoInner,#agendaInner,#turma1Inner{max-width:680px;margin:0 auto;padding:40px 20px 80px}
#escolha .brand,#aplicacao .brand,#agenda .brand,#turma1 .brand{color:var(--ink);margin-bottom:24px}
#escolha .brand span,#aplicacao .brand span,#agenda .brand span,#turma1 .brand span{color:var(--copper)}
#escolha h1,#aplicacao h1,#agenda h1,#turma1 h1{font-family:var(--display);font-weight:700;font-size:clamp(30px,4.8vw,46px);margin:8px 0 12px;color:var(--ink)}
#escolha .q-help,#aplicacao .q-help{color:var(--ink-2)}
.escolha-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin:28px 0}
.escolha-card{background:var(--white);border:1px solid var(--line);border-radius:var(--r);padding:24px;display:flex;flex-direction:column;gap:10px}
.escolha-card.hi{background:var(--copper-soft);border-color:var(--line-copper);box-shadow:0 0 0 1px var(--copper)}
.escolha-card .det{font-size:11px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--copper)}
.escolha-card h2{font-size:24px;font-weight:700}
.escolha-card p{color:var(--ink-2);font-size:14px;flex:1}
.escolha-card .btn{width:100%;margin-top:8px}
.escolha-card .btn-outline-light{color:var(--ink);border-color:rgba(11,22,34,.22)}
.wa-link{background:none;border:0;color:var(--ink-2);text-decoration:underline;font-weight:500;padding:0}
.valores{display:grid;gap:10px;margin:16px 0 22px}
.valor-card{background:var(--white);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;display:flex;justify-content:space-between;gap:12px;align-items:center}
.valor-card span{color:var(--ink-2);font-size:13.5px}
.valor-card strong{font-size:16px;color:var(--ink)}
.app-input{width:100%;font:inherit;font-size:16px;background:var(--white);border:1px solid var(--line);color:var(--ink);border-radius:var(--r);padding:13px 14px;margin-top:6px}
.app-input:focus{border-color:var(--copper);outline:none;box-shadow:0 0 0 3px var(--copper-soft)}
.aceite{display:flex;gap:10px;align-items:flex-start;color:var(--ink-2);font-size:14px;margin-top:12px}
.turma-row{display:flex;justify-content:space-between;gap:14px;align-items:center;padding:14px;margin-bottom:10px;background:var(--white);border:1px solid var(--line);border-radius:var(--r)}
.turma-row .avatar{width:48px;height:48px;border-radius:var(--r);object-fit:cover;background:var(--sand)}
.turma-row .who{display:flex;align-items:center;gap:12px;min-width:0}
.turma-row .btn{flex-shrink:0;padding:10px 14px;font-size:12px}
.turma-row .meta{color:var(--muted);font-size:13px}
.foto-tag{font-size:10px;color:var(--muted)}

.ed-btn{position:fixed;right:16px;bottom:16px;z-index:40;display:flex;align-items:center;gap:8px;background:var(--copper);color:var(--navy);border:0;border-radius:var(--pill);padding:11px 16px;font-weight:700;font-size:12px;letter-spacing:.04em;text-transform:uppercase}
.ed-btn svg{width:15px;height:15px}
.ed{position:fixed;top:0;right:0;bottom:0;width:min(440px,100%);z-index:50;background:var(--white);border-left:1px solid var(--line);display:flex;flex-direction:column;font-size:14px;color:var(--ink)}
.ed header{padding:16px 18px 12px;border-bottom:1px solid var(--line);display:grid;gap:10px}
.ed .ed-top{display:flex;justify-content:space-between;align-items:center}
.ed .x{background:none;border:0;font-size:22px;padding:4px 8px;color:var(--muted)}
.ed .prof{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.ed .prof label{display:grid;gap:4px;font-size:10px;font-weight:600;color:var(--muted);text-transform:uppercase}
.ed select{font:inherit;font-size:12px;padding:6px 8px;border:1px solid var(--line);border-radius:10px;background:var(--cream);color:var(--ink);width:100%}
.ed .tabs{display:flex;gap:4px;overflow-x:auto}
.ed .tabs button{flex:none;background:var(--cream);border:1px solid var(--line);border-radius:var(--pill);padding:5px 10px;font-size:12px;font-weight:600;color:var(--muted)}
.ed .tabs button.on{background:var(--copper);border-color:var(--copper);color:var(--navy)}
.ed .body{flex:1;overflow-y:auto;padding:16px 18px 28px}
.ed .hint{background:var(--copper-soft);border-radius:var(--r);padding:12px;color:var(--ink-2);font-size:12.5px;margin-bottom:14px;border:1px solid var(--line-copper)}
.ed fieldset{border:1px solid var(--line);border-radius:var(--r);padding:10px 12px 12px;margin:0 0 12px}
.ed legend{font-weight:700;font-size:12px;padding:0 4px}
.ed .f{display:grid;gap:4px;margin-bottom:10px}
.ed .f span{font-size:11px;font-weight:600;color:var(--muted)}
.ed input[type=text],.ed textarea{font:inherit;width:100%;border:1px solid var(--line);border-radius:10px;padding:8px 10px;background:var(--cream);color:var(--ink)}
.ed textarea{min-height:64px;resize:vertical}
.ed footer{font-size:12px;border-top:1px solid var(--line);padding:12px 16px;display:flex;gap:6px;flex-wrap:wrap;background:var(--white);color:var(--ink)}
.ed footer button{border:1px solid var(--line);background:var(--cream);border-radius:var(--pill);padding:8px 12px;font-weight:600;font-size:12px}
.ed footer button.pr{background:var(--copper);color:var(--navy);border-color:var(--copper)}

  const label = fotoLabel(num, arquivo, naturalW, naturalH, legenda);

function bindFotoLabel(img, capEl, num, arquivo, legenda){
  if(!capEl || !img) return;
  const paint = ()=>{
    capEl.innerHTML = fotoLabelHtml(num, arquivo, img.naturalWidth, img.naturalHeight, legenda);
  };
  if(img.complete && img.naturalWidth) paint();
  else img.addEventListener("load", paint, {once:true});
  capEl.innerHTML = fotoLabelHtml(num, arquivo, 0, 0, legenda);
}
function applyPhotoEl(box, arquivo, slotKey, legenda){
  if(!box) return;
  const capEl = box.querySelector(".cap");
  let img = box.querySelector("img");
  const num = fotoNum(slotKey || arquivo);
  if(arquivo){
    if(!img){ img=document.createElement("img"); img.alt=""; img.loading="eager"; img.decoding="async"; box.insertBefore(img, box.firstChild); }

    img.src=arquivo;
    box.classList.add("has-img");
    bindFotoLabel(img, capEl, num, arquivo, legenda||"");
  } else {
    if(img) img.remove();
    box.classList.remove("has-img");
    if(capEl) capEl.innerHTML = "";
  }
}

function quizOptionTitle(group, code){
  if(!code) return "";
  if(group==="dores"){
    const o=(C.quiz.dores_opcoes||[]).find(x=>x.v===code);
    return o ? (o.titulo||code) : code;
  }
  const P=(C.quiz.perguntas||[]).find(p=>p.id===group);
  if(!P) return String(code);
  const o=(P.opcoes||[]).find(x=>x.v===code);
  return o ? (o.titulo||code) : String(code);
}
function crmPhone(raw){
  const d=String(raw||"").replace(/\D/g,"");
  if(!d) return "";
  if(d.startsWith("55") && (d.length===12 || d.length===13)) return d;
  if(d.length===10 || d.length===11) return "55"+d;
  return d;
}

  const ordemLabels=ordemSrc.map(c=>quizOptionTitle("dores",c)).filter(Boolean);
  return {
    nome: S.lead.nome||"",
    whatsapp: crmPhone(S.lead.whatsapp||""),
    cidade: S.lead.cidade||"",
    dores: S.dores||[],
    ordem: ordemSrc||[],

function wireStatsCounters(){
  const root=$("#stats");
  if(!root) return;
  if(window._statsObs){ try{ window._statsObs.disconnect(); }catch(e){} }
  const items=[...root.querySelectorAll(".s[data-count]")];
  if(!items.length) return;
  const reduce = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  const run = (el, delay)=>{
    const target=Number(el.dataset.count)||0;
    const strong=el.querySelector("strong");
    if(!strong) return;
    el.classList.add("is-in");
    if(reduce){ strong.textContent=String(target); return; }
    const dur=900+Math.min(target,12)*40;
    const start=performance.now()+delay;
    const tick=(now)=>{
      if(now<start){ requestAnimationFrame(tick); return; }
      const t=Math.min(1,(now-start)/dur);
      const eased=1-Math.pow(1-t,3);
      strong.textContent=String(Math.round(target*eased));
      if(t<1) requestAnimationFrame(tick);
      else strong.textContent=String(target);
    };
    requestAnimationFrame(tick);
  };
  if(!("IntersectionObserver" in window)){
    items.forEach((el,i)=>run(el,i*90));
    return;
  }
  window._statsObs=new IntersectionObserver(entries=>{
    entries.forEach(en=>{
      if(!en.isIntersecting) return;
      const el=en.target;
      const i=items.indexOf(el);
      run(el, Math.max(0,i)*90);
      window._statsObs.unobserve(el);
    });
  },{threshold:0.4});
  items.forEach(el=>window._statsObs.observe(el));
}

let _mbarObs;
function setupMbarHide(){
  const mbar=$("[data-cta-mobile]"); if(!mbar) return;
  if(_mbarObs){ _mbarObs.disconnect(); _mbarObs=null; }
  const targets=[document.querySelector(".hero-cine"), document.querySelector(".final")].filter(Boolean);
  if(!targets.length || !("IntersectionObserver" in window)) return;
  const seen=new Map();
  _mbarObs=new IntersectionObserver(entries=>{
    entries.forEach(e=>seen.set(e.target,e.isIntersecting));
    const hide=[...seen.values()].some(Boolean);
    mbar.classList.toggle("is-hidden", hide);
  },{threshold:0.15});
  targets.forEach(t=>_mbarObs.observe(t));
}

/* ---------- APLICACAO ---------- */
function prefillFrom(path){
  if(path==="quiz.nome") return S.lead.nome||"";
  if(path==="quiz.whatsapp") return S.lead.whatsapp||"";
  if(path==="quiz.cidade") return S.lead.cidade||"";
  if(path==="quiz.alunos"){
    const map={ate50:"Até 50","50a75":"De 51 a 75","51a75":"De 51 a 75","76a100":"De 76 a 100","100a150":"De 101 a 150","101a150":"De 101 a 150","150mais":"Mais de 150"};
    return map[S.a.alunos]||"";
  }
  return "";
}
function startAplicacao(resume){
  const saved = store.get("imersao_aplicacao");
  if(resume && saved && !saved.done){
    app = saved;
  } else {
    app={etapa:-1,q:0,answers:{},done:false,_invSeen:false,_abandono:false};
    (C.aplicacao.etapas||[]).forEach(et=>{
      (et.perguntas||[]).forEach(p=>{
        if(p.prefill){ const v=prefillFrom(p.prefill); if(v) app.answers[p.id]=v; }
      });
    });
  }
  store.set("imersao_aplicacao",app);
  track("aplicacao_inicio",{});
  renderAplicacao();
}
function markAbandono(){
  if(app.done || app._abandono) return;
  const etapas=C.aplicacao.etapas||[];
  const et=etapas[app.etapa];
  if(et && et.id==="investimento" && app._invSeen){
    app._abandono=true;
    track("aplicacao_abandono",{etapa:app.etapa+1,objecao:"preco"});
    if(CONFIG.WEBHOOK_URL){
      try{ fetch(CONFIG.WEBHOOK_URL,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({tipo:"aplicacao_abandono",etapa:app.etapa+1,objecao:"preco",respostas:app.answers,lead:S.lead,rota:S.route})}).catch(()=>{}); }catch(e){}
    }
    store.set("imersao_aplicacao",app);
  }
}
function saveAppStep(){
  store.set("imersao_aplicacao",app);
  if(CONFIG.WEBHOOK_URL){
    try{ fetch(CONFIG.WEBHOOK_URL,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({tipo:"aplicacao_etapa",etapa:app.etapa,respostas:app.answers,lead:S.lead,rota:S.route})}).catch(()=>{}); }catch(e){}
  }
}
function renderAplicacao(){
  showView("aplicacao");
  const A=C.aplicacao;
  if(app.done){
    const F=A.final;
    $("#aplicacaoInner").innerHTML=`<div class="brand">VOLL <span>IMERSÃO PRESENCIAL</span></div>
      <div class="q-step">Aplicação enviada</div>
      <h1 class="serif">${md(F.titulo)}</h1>

      <div class="cta-duo cta-stack">
        <button type="button" class="btn btn-gold" id="finAgenda">${md(F.adiantar_botao||"Escolher meu horário")}</button>

    $("#finPart").onclick=()=>showTurma1({from:"aplicacao"});
    $("#finBack").onclick=()=>showLP();
    return;
  }
  if(app.etapa<0){
    const Ab=A.abertura||{};
    $("#aplicacaoInner").innerHTML=`<div class="brand">VOLL <span>IMERSÃO PRESENCIAL</span></div>
      <div class="q-step">${md(Ab.etiqueta||"Aplicação")}</div>
      <h1 class="serif">${md(Ab.titulo||"Vamos começar")}</h1>
      <p class="q-help">${md(Ab.texto||"")}</p>
      <ul class="q-list">${(Ab.itens||[]).map(i=>`<li>${md(i)}</li>`).join("")}</ul>

      <button type="button" class="q-back" id="appBackIntro" style="margin-top:20px;display:block">← Voltar</button>`;
    $("#appStart").onclick=()=>{ app.etapa=0; app.q=0; store.set("imersao_aplicacao",app); renderAplicacao(); };
    $("#appBackIntro").onclick=()=>showEscolha();
    return;
  }
  const etapas=A.etapas;
  const et=etapas[app.etapa];
  const total=etapas.length;
  const perguntas=et.perguntas||[];
  const pq=perguntas[app.q];
  let body="";
  if(et.valores && app.q===0 && !app._invSeen){
    app._invSeen=true; track("aplicacao_investimento_visto",{}); store.set("imersao_aplicacao",app);
  }
  if(et.valores && app.q===0){
    body+=`<div class="valores">${et.valores.map(v=>`<div class="valor-card"><span>${md(v.titulo)}</span><strong>${md(v.valor)}</strong></div>`).join("")}</div>`;
  }
  if(pq){
    const titleHtml = (pq.tipo==="aceite"||pq.tipo==="check") ? "" : `<h2>${md(pq.titulo)}</h2>`;
    body+=`${titleHtml}${pq.ajuda?`<p class="q-help">${md(pq.ajuda)}</p>`:""}`;
    const cur=app.answers[pq.id]||"";
    if(pq.tipo==="texto"||pq.tipo==="tel"||pq.tipo==="textarea"){
      body+= pq.tipo==="textarea"
        ? `<textarea class="app-input" id="appField" rows="5">${esc(cur)}</textarea>`
        : `<input class="app-input" id="appField" type="${pq.tipo==="tel"?"tel":"text"}" value="${esc(cur)}">`;
    } else if(pq.tipo==="opcoes"||pq.tipo==="unica"||pq.opcoes){
      body+=`<div class="q-opts">${(pq.opcoes||[]).map(o=>{
        const v=typeof o==="string"?o:(o.v||o.titulo);
        const t=typeof o==="string"?o:(o.titulo||o.v);
        return `<button type="button" class="q-opt ${cur===v?"sel":""}" data-v="${esc(v)}"><span class="dot"></span><span><strong>${md(t)}</strong></span></button>`;
      }).join("")}</div>`;
    } else if(pq.tipo==="aceite"||pq.tipo==="check"){
      body+=`<label class="aceite"><input type="checkbox" id="appField" ${cur?"checked":""}> ${md(pq.titulo_check||pq.titulo)}</label>`;
    } else {
      body+=`<input class="app-input" id="appField" value="${esc(cur)}">`;
    }
  }
  const isLastQ = app.q >= perguntas.length-1;
  const isLastEtapa = app.etapa >= total-1;
  const btnLabel = (isLastEtapa && isLastQ) ? (et.botao||A.navegacao?.enviar||"Enviar") : (A.navegacao?.continuar||"Continuar");
  const etapaLabel = (A.navegacao?.etapa||"Etapa {n} de 5").replace("{n}", String(app.etapa+1));
  $("#aplicacaoInner").innerHTML=`<div class="brand">VOLL <span>IMERSÃO PRESENCIAL</span></div>
    <div class="q-progress"><i style="width:${Math.round((app.etapa+1)/total*100)}%"></i></div>
    <div class="q-step">${md(etapaLabel)} · ${md(et.titulo)}</div>
    ${et.texto && app.q===0?`<p class="q-help">${md(et.texto)}</p>`:""}
    ${body}
    <div class="q-err" id="appErr"></div>
    <div class="q-nav">
      <button class="q-back" type="button" id="appBack">← ${md(A.navegacao?.voltar||"Voltar")}</button>
      <button class="btn btn-gold" type="button" id="appNext">${md(btnLabel)}</button>
    </div>`;
  $("#aplicacaoInner").querySelectorAll(".q-opt").forEach(b=>b.onclick=()=>{
    app.answers[pq.id]=b.dataset.v;
    $("#aplicacaoInner").querySelectorAll(".q-opt").forEach(x=>x.classList.remove("sel"));
    b.classList.add("sel");
  });
  $("#appBack").onclick=()=>{
    if(app.q>0){ app.q--; renderAplicacao(); return; }
    if(app.etapa>0){
      if(et.id==="investimento") markAbandono();
      app.etapa--; app.q=Math.max(0,(etapas[app.etapa].perguntas||[]).length-1); renderAplicacao(); return;
    }
    markAbandono();
    app.etapa=-1; renderAplicacao();
  };
  $("#appNext").onclick=()=>{
    if(pq){
      let val=app.answers[pq.id];
      const field=$("#appField");
      if(field){
        if(field.type==="checkbox") val=field.checked;
        else val=field.value.trim();
      }
      if(pq.tipo==="aceite"||pq.tipo==="check"){
        if(!val){ $("#appErr").textContent="É preciso aceitar para continuar."; return; }
      } else if(pq.opcoes || pq.tipo==="opcoes"||pq.tipo==="unica"){
        if(!app.answers[pq.id]){ $("#appErr").textContent=md(A.navegacao?.obrigatorio||"Escolha uma opção."); return; }
        val=app.answers[pq.id];
      } else {
        if(!val){ $("#appErr").textContent="Preencha este campo."; return; }
        app.answers[pq.id]=val;
      }
      if(typeof val!=="undefined") app.answers[pq.id]=val;
    }
    if(!isLastQ){ app.q++; renderAplicacao(); return; }
    track("aplicacao_etapa",{n:app.etapa+1});
    saveAppStep();
    if(!isLastEtapa){ app.etapa++; app.q=0; renderAplicacao(); return; }
    track("aplicacao_enviada",{});
    app.done=true; saveAppStep();
    if(CONFIG.WEBHOOK_URL){
      try{ fetch(CONFIG.WEBHOOK_URL,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({tipo:"aplicacao_enviada",respostas:app.answers,lead:S.lead,rota:S.route})}).catch(()=>{}); }catch(e){}
    }
    renderAplicacao();
  };
}

    if(opt&&VARIANTES["quiz.dores_opcoes."+opt.v+".texto"]) return VARIANTES["quiz.dores_opcoes."+opt.v+".texto"];
  }
  return null;
}
function currentAsText(path, isLines){
  const v=getByPath(path);
  if(isLines && Array.isArray(v)) return v.join("\n");
  return String(v==null?"":v);
}
function matchVersao(path, text){
  const vers=variantesFor(path); if(!vers) return null;
  const t=normTxt(text);
  for(const k of Object.keys(VERSAO_LABELS)){
    if(k==="custom") continue;
    if(vers[k]!=null && normTxt(vers[k])===t) return k;
  }
  return "custom";
}
function versaoSelect(path, text){
  const vers=variantesFor(path); if(!vers) return "";
  const cur=matchVersao(path, text);
  const keys=["atual","visceral","ultra","visceral_100000x"].filter(k=>vers[k]!=null);
  const opts=keys.map(k=>`<option value="${k}" ${cur===k?"selected":""}>${VERSAO_LABELS[k]}</option>`).join("")
    +`<option value="custom" ${cur==="custom"?"selected":""}>${VERSAO_LABELS.custom}</option>`;
  return `<div class="ver"><label>Versão</label><select data-versao="${esc(path)}">${opts}</select></div>`;
}
function field(p,val,k,isLines){
  const text=isLines?(Array.isArray(val)?val.join("\n"):String(val||"")):String(val||"");
  const long=isLines||text.length>60||/texto|resposta|mensagem|prova|frase|especialidade|linha|nota|ajuda/.test(k);
  const sel=versaoSelect(p, text);
  const ctrl=long
    ?`<textarea rows="${Math.min(8,Math.max(2,Math.ceil(text.length/46)+1))}" data-p="${esc(p)}"${isLines?' data-lines="1"':""}>${esc(text)}</textarea>`
    :`<input data-p="${esc(p)}" value="${esc(text)}">`;
  return `<label class="f"><span>${esc(label(k))}</span>${sel}${ctrl}</label>`;
}
function build(obj,path){
  let h="";
  for(const k of Object.keys(obj)){
    if(HIDE.has(k)) continue;
    const v=obj[k], p=path+"."+k;
    if(typeof v==="string") h+=field(p,v,k,false);
    else if(Array.isArray(v)&&v.every(x=>typeof x==="string")) h+=field(p,v,k,true);
    else if(v&&typeof v==="object") h+=`<fieldset><legend>${esc(Array.isArray(obj)?(v.nome||v.titulo||v.pergunta||v.etiqueta||label(k)):label(k))}</legend>${build(v,p)}</fieldset>`;
  }
  return h;
}
function saveContent(){
  store.set("imersao_conteudo",C);
  if(!$("#lp").hidden) renderLP();
  else if(!$("#escolha").hidden) showEscolha();
  else if(!$("#aplicacao").hidden) renderAplicacao();
  else if(!$("#agenda").hidden) showAgenda();
  else renderQuiz();
  flash("Salvo");
}
function bindEditorFields(){
  document.querySelectorAll("#edBody [data-p]").forEach(el=>{
    el.addEventListener("input",()=>{
      const path=el.dataset.p;
      const val=el.dataset.lines ? el.value.split("\n").map(s=>s.trim()).filter(Boolean) : el.value;
      setByPath(path,val);
      const sel=document.querySelector('#edBody select[data-versao="'+path.replace(/"/g,'\\"')+'"]');
      if(sel){
        const m=matchVersao(path, el.value);
        if(m) sel.value=m;
      }
      clearTimeout(saveT); saveT=setTimeout(saveContent,250);
    });
  });
  document.querySelectorAll("#edBody select[data-versao]").forEach(sel=>{
    sel.addEventListener("change",()=>{
      const path=sel.dataset.versao, key=sel.value;
      if(key==="custom") return;
      const vers=variantesFor(path); if(!vers||vers[key]==null) return;
      const raw=vers[key];
      const input=document.querySelector('#edBody [data-p="'+path.replace(/"/g,'\\"')+'"]');
      if(input){
        if(input.dataset.lines){
          input.value=raw;
          setByPath(path, raw.split("\n").map(s=>s.trim()).filter(Boolean));
        } else {
          input.value=raw;
          setByPath(path, raw);
        }
      } else {
        setByPath(path, raw);
      }
      saveContent();
    });
  });
}
function renderEditor(){
  set("edTabs",TABS.map(([k,n])=>`<button type="button" class="${k===tab?"on":""}" data-t="${k}">${n}</button>`).join(""));
  document.querySelectorAll("#edTabs button").forEach(b=>b.onclick=()=>{tab=b.dataset.t;renderEditor();});
  const hint=`<div class="hint">Em campos com versões, escolha <b>Atual</b>, <b>Visceral</b>, <b>Ultra</b> ou <b>Visceral 100000x</b> — ou escreva a sua. <code>*texto*</code> = itálico dourado, <code>**texto**</code> = negrito. Use <code>{nome}</code> <code>{cidade}</code> no quiz/CTA.</div>`;
  if(tab==="json"){ set("edBody",hint+`<textarea class="json" readonly>${esc(JSON.stringify(C,null,2))}</textarea>`); return; }
  set("edBody",hint+build(C[tab],tab));
  bindEditorFields();
}
function flash(t){ const o=$("#edOk"); o.textContent=t; clearTimeout(o._t); o._t=setTimeout(()=>o.textContent="",1600); }
function syncPreview(){
  const opts=DORES_ORDEM.map(v=>`<option value="${esc(v)}">${esc((C.dores[v]&&C.dores[v].etiqueta)||v)}</option>`).join("");
  $("#pvP1").innerHTML=opts; $("#pvP2").innerHTML=opts; $("#pvP3").innerHTML=opts;
  const p=prioridades();
  $("#pvP1").value=p[0]; $("#pvP2").value=p[1]; $("#pvP3").value=p[2];
}
function ensurePreviewProfile(){
  if(!S.ordem.length){ S.ordem=[...DEFAULT_ORDEM]; S.dores=[...DEFAULT_ORDEM]; S.a={alunos:"51a75",numeros:"sim",momento:"agora"}; S.lead={nome:"Mariana",whatsapp:"",cidade:"Jundiaí, SP"}; S.route="quente"; S.done=true; S.step=99; }
}
function applyPreview(){
  const a=$("#pvP1").value,b=$("#pvP2").value,c=$("#pvP3").value;
  const ordem=[a]; if(b&&!ordem.includes(b)) ordem.push(b); if(c&&!ordem.includes(c)) ordem.push(c);
  S.ordem=ordem; S.dores=[...new Set([...ordem,...S.dores])];
  store.set("imersao_estado",S); renderLP();
}
function isAdminMode(){ return location.hash==="#admin"; }
function syncAdminMode(){
  const on=isAdminMode();
  const ed=$("#ed"), btn=$("#edOpen");
  if(!on){
    if(ed) ed.hidden=true;
    if(btn) btn.hidden=true;
    return;
  }
  if(btn && (!ed || ed.hidden)) btn.hidden=false;
}
$("#edOpen").onclick=()=>{
  if(!isAdminMode()) return;
  ensurePreviewProfile(); if($("#lp").hidden) showLP(); syncPreview(); renderEditor(); $("#ed").hidden=false; $("#edOpen").hidden=true;
};
$("#edClose").onclick=()=>{ $("#ed").hidden=true; $("#edOpen").hidden=!isAdminMode(); };
$("#pvP1").onchange=applyPreview; $("#pvP2").onchange=applyPreview; $("#pvP3").onchange=applyPreview;
$("#edCopy").onclick=()=>{
  const txt="const CONTEUDO = "+JSON.stringify(C,null,2)+";";
  const fallback=()=>{ tab="json"; renderEditor(); const t=document.querySelector("#edBody textarea"); t.focus(); t.select(); flash("Selecione e copie"); };
  try{ navigator.clipboard.writeText(txt).then(()=>flash("Copiado")).catch(fallback); }catch(e){ fallback(); }
};
$("#edReset").onclick=()=>{ C=clone(CONTEUDO_ORIGINAL); store.set("imersao_conteudo",null); renderEditor(); renderLP(); flash("Restaurado"); };
$("#edRestart").onclick=()=>{ S={step:-1,dores:[],ordem:[],a:{},lead:{nome:"",whatsapp:"",cidade:""},route:"quente",done:false}; store.set("imersao_estado",S); store.set("imersao_aplicacao",null); app={etapa:-1,q:0,answers:{},done:false}; $("#ed").hidden=true; $("#edOpen").hidden=!isAdminMode(); hideAllViews(); $("#quiz").hidden=false; renderQuiz(); window.scrollTo(0,0); };
window.addEventListener("hashchange", syncAdminMode);


function syncPhotosFromOriginal(){
  const O = CONTEUDO_ORIGINAL;
  if(!C || !O) return;
  if(O.fotos) C.fotos = clone(O.fotos);
  if(O.secoes && O.secoes.resolve && C.secoes){
    C.secoes.resolve = clone(O.secoes.resolve);
  }
  if(O.dores && C.dores){
    Object.keys(O.dores).forEach(k=>{
      if(!C.dores[k]) return;
      if(O.dores[k].arquivo) C.dores[k].arquivo = O.dores[k].arquivo;
      if(O.dores[k].foto!=null) C.dores[k].foto = O.dores[k].foto;
    });
  }
  // sempre usa a lista completa do arquivo (evita cache com 6 studios)
  if(O.secoes && C.secoes){
    if(O.secoes.participantes){
      C.secoes.participantes = clone(O.secoes.participantes);
    }
    if(O.secoes.socios){
      C.secoes.socios = clone(O.secoes.socios);
    }
    if(O.secoes.especialistas){
      C.secoes.especialistas = clone(O.secoes.especialistas);
    }
    if(O.secoes.selecao){
      C.secoes.selecao = clone(O.secoes.selecao);
    }
    if(O.secoes.diferenca){
      C.secoes.diferenca = clone(O.secoes.diferenca);
    }
  }
  if(O.escolha) C.escolha = clone(O.escolha);
  if(O.quiz && O.quiz.dores_opcoes && C.quiz) C.quiz.dores_opcoes = clone(O.quiz.dores_opcoes);
  // foto da Lívia no laptop removida do site
  const ban=["/img/exec1.jpg"];
  (function scrub(x){
    if(!x||typeof x!=="object") return;
    if(Array.isArray(x)){ x.forEach(scrub); return; }
    Object.keys(x).forEach(k=>{
      if(typeof x[k]==="string" && ban.indexOf(x[k])>=0) x[k]="";
      else if(x[k] && typeof x[k]==="object") scrub(x[k]);
    });
  })(C);
}

const savedC=store.get("imersao_conteudo"); if(savedC&&savedC.dores&&savedC.secoes&&savedC.secoes.resolve&&savedC.botoes&&savedC.botoes.principal) C=savedC;
syncPhotosFromOriginal();
store.set("imersao_conteudo",C);
const savedS=store.get("imersao_estado"); if(savedS&&Array.isArray(savedS.dores)) S=savedS;
syncAdminMode();
if(S.done && (S.ordem.length||S.dores.length)) showLP(); else { if(S.step>10) S.step=-1; renderQuiz(); }

/* ---------- V6 motion / editorial ---------- */
function wireDaysSticky(){
  const panels=[...document.querySelectorAll("[data-day-panel]")];
  const rail=document.getElementById("daysRail");
  if(!panels.length||!rail) return;
  const marks=[...rail.querySelectorAll("[data-day]")];
  if(window._daysObs){ try{ window._daysObs.disconnect(); }catch(e){} }
  if(!("IntersectionObserver" in window)){ marks[0]&&marks[0].classList.add("on"); return; }
  window._daysObs=new IntersectionObserver(entries=>{
    entries.forEach(en=>{
      if(!en.isIntersecting) return;
      const i=en.target.getAttribute("data-day-panel");
      marks.forEach(m=>m.classList.toggle("on", m.getAttribute("data-day")===i));
    });
  },{threshold:0.55});
  panels.forEach(p=>window._daysObs.observe(p));
}
function setupHeroSlideshow(){
  const slides=[...document.querySelectorAll("#heroMedia .slide")];
  if(slides.length<2) return;
  if(window._heroTimer) clearInterval(window._heroTimer);
  let i=0;
  window._heroTimer=setInterval(()=>{
    slides[i].classList.remove("is-on");
    i=(i+1)%slides.length;
    slides[i].classList.add("is-on");
  },5200);
}
function setupHeaderScroll(){
  const hdr=document.getElementById("siteHeader");
  if(!hdr) return;
  const onScroll=()=>{ hdr.classList.toggle("is-scrolled", window.scrollY>40); };
  window.removeEventListener("scroll", window._hdrScroll||(()=>{}));
  window._hdrScroll=onScroll;
  window.addEventListener("scroll", onScroll, {passive:true});
  onScroll();
}
function setupReveals(){
  const els=[...document.querySelectorAll("#lp [data-reveal]")];
  if(window._revealObs){ try{ window._revealObs.disconnect(); }catch(e){} }
  if(!els.length) return;
  if(!("IntersectionObserver" in window)){ els.forEach(e=>e.classList.add("is-in")); return; }
  window._revealObs=new IntersectionObserver(entries=>{
    entries.forEach(en=>{ if(en.isIntersecting){ en.target.classList.add("is-in"); window._revealObs.unobserve(en.target); } });
  },{threshold:0.18, rootMargin:"0px 0px -8% 0px"});
  els.forEach(el=>window._revealObs.observe(el));
}
function setupV6Motion(){
  setupHeroSlideshow();
  setupHeaderScroll();
  setupReveals();
  wireDaysSticky();
}
